name: تحويل ونشر صوت "ديّ" العصبي (عربي · بنت)

# هذا الـ workflow يُشغَّل يدويًا مرة واحدة فقط (أو عند الحاجة لإعادة النشر).
# يأخذ نموذج phoonnx_ar_dii_espeak من Hugging Face (صوت أنثى عربي، ترخيص غير تجاري CC BY-NC-ND 4.0)
# ويحوّله لصيغة sherpa-onnx (نفس صيغة Piper: onnx + tokens.txt + espeak-ng-data)، ثم ينشره كملف
# مرفق (Release Asset) داخل هذا المستودع تحت الوسم tts-voices، ليقرأه NeuralVoiceManager عند التنزيل.
#
# ملاحظة ترخيص مهمة: صوت "ديّ" غير تجاري فقط (CC BY-NC-ND 4.0) - لا يصلح لتطبيق فيه إعلانات أو اشتراكات.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert-and-publish:
    name: تحويل صوت ديّ ونشره
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: تثبيت أدوات التحويل
        run: pip install --quiet onnx==1.17.0 onnxruntime==1.17.1

      - name: تنزيل ملفات نموذج ديّ من Hugging Face
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          curl -fL -o dii_ar.onnx \
            "https://huggingface.co/OpenVoiceOS/phoonnx_ar_dii_espeak/resolve/main/dii_ar.onnx"
          curl -fL -o dii_ar.piper.json \
            "https://huggingface.co/OpenVoiceOS/phoonnx_ar_dii_espeak/resolve/main/dii_ar.piper.json"

      - name: تضمين بيانات sherpa-onnx في النموذج وتوليد tokens.txt
        run: |
          cat > work/convert.py << 'PYEOF'
          import json
          import onnx

          def add_meta_data(filename, meta_data):
              model = onnx.load(filename)
              for key, value in meta_data.items():
                  meta = model.metadata_props.add()
                  meta.key = key
                  meta.value = str(value)
              onnx.save(model, filename)

          with open("dii_ar.piper.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          id_map = config["phoneme_id_map"]
          with open("tokens.txt", "w", encoding="utf-8") as f:
              for s, i in id_map.items():
                  f.write(f"{s} {i[0]}\n")
          print("Generated tokens.txt")

          audio = config.get("audio", {})
          espeak = config.get("espeak", {})
          meta_data = {
              "model_type": "vits",
              "comment": "piper",  # sherpa-onnx يشترط هذه القيمة لنماذج Piper
              "language": "Arabic",
              "voice": espeak.get("voice", "ar"),
              "has_espeak": 1,
              "n_speakers": config.get("num_speakers", 1),
              "sample_rate": audio.get("sample_rate", 22050),
          }
          add_meta_data("dii_ar.onnx", meta_data)
          print("Added metadata to dii_ar.onnx")
          PYEOF
          cd work && python3 convert.py

      - name: تنزيل بيانات espeak-ng المشتركة
        run: |
          set -euo pipefail
          cd work
          curl -fL -o espeak-ng-data.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2"
          tar xf espeak-ng-data.tar.bz2

      - name: تجميع الأرشيف بصيغة NeuralVoiceManager المتوقَّعة
        run: |
          set -euo pipefail
          cd work
          mkdir -p vits-piper-ar-dii-medium
          mv dii_ar.onnx vits-piper-ar-dii-medium/ar-dii-medium.onnx
          mv tokens.txt vits-piper-ar-dii-medium/tokens.txt
          cp -r espeak-ng-data vits-piper-ar-dii-medium/espeak-ng-data
          tar cjf vits-piper-ar-dii-medium.tar.bz2 vits-piper-ar-dii-medium
          ls -lh vits-piper-ar-dii-medium.tar.bz2

      - name: نشره كملف مرفق على إصدار tts-voices
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tts-voices
          name: نماذج الصوت العصبي الإضافية (tts-voices)
          body: |
            ملفات أصوات عصبية إضافية غير مُدرجة في إصدارات sherpa-onnx الرسمية، يستخدمها NeuralVoiceManager.

            - vits-piper-ar-dii-medium.tar.bz2: صوت "ديّ" (عربي · بنت)، مصدره
              OpenVoiceOS/phoonnx_ar_dii_espeak. الترخيص: CC BY-NC-ND 4.0 — **غير تجاري فقط**.
          make_latest: false
          fail_on_unmatched_files: true
          files: work/vits-piper-ar-dii-medium.tar.bz2
